<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta http-equiv="Content-Security-Policy" content="frame-src 'none'" />
    <title>Playhoot</title>
    <meta
      name="description"
      content="Game night, anywhere. Join a game with a code and play with friends."
    />
    <meta name="theme-color" content="#141134" />

    <!-- Icons and link previews: docs/design/ASSETS.md -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Playhoot" />
    <meta
      property="og:description"
      content="Game night, anywhere. Join a game with a code and play with friends."
    />
    <meta property="og:image" content="/assets/images/og-share.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
